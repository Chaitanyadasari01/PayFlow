# PayFlow Application Configuration
spring.application.name=payflow-api
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${PAYFLOW_DB_USER:root}
spring.datasource.password=${PAYFLOW_DB_PASSWORD:Chaitu123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
payflow.jwt.secret=${PAYFLOW_JWT_SECRET:payflow-dev-secret-key-min-256-bits-long-for-hs256-algorithm}
payflow.jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.payflow=DEBUG
logging.level.org.springframework.security=WARN
