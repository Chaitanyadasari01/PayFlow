spring.application.name=payflow-api-test
spring.datasource.url=jdbc:h2:mem:payflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
payflow.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm-security
payflow.jwt.expiration-ms=3600000
payflow.webhook.retry-interval-ms=60000
logging.level.com.payflow=DEBUG
logging.level.org.springframework.security=WARN
